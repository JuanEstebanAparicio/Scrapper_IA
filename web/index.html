<!-- web/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Casos de uso generados</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    pre { background:#f5f5f5; padding:12px; border-radius:6px; overflow:auto; }
    .case { margin-bottom:24px; border-bottom:1px solid #eee; padding-bottom:12px; }
    button { margin-right:8px; }
  </style>
</head>
<body>
  <h1>Casos de uso generados</h1>
  <div id="content">Cargando...</div>

  <script>
    async function load() {
      try {
        const resp = await fetch('../data/usecases.json');
        const usecases = await resp.json();
        const container = document.getElementById('content');
        container.innerHTML = '';
        usecases.forEach((u, i) => {
          const div = document.createElement('div');
          div.className = 'case';
          div.innerHTML = `<h2>${i+1}. ${u.title}</h2>
                           <p><strong>Descripción:</strong> ${u.description}</p>
                           <pre id="code${i}">${u.script}</pre>
                           <button onclick="copyCode('code${i}')">Copiar</button>
                           <button onclick="downloadCode(${i})">Descargar</button>`;
          container.appendChild(div);
        });
      } catch (e) {
        document.getElementById('content').innerText = 'No se pudo cargar usecases.json';
      }
    }
    function copyCode(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text);
      alert('Código copiado');
    }
    function downloadCode(i) {
      const text = document.getElementById('code'+i).innerText;
      const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `usecase_${i+1}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    load();
  </script>
</body>
</html>
